<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Deluxe</title>
<style>
  :root {
    --bg: #0b1020;
    --board: #151b30;
    --grid: rgba(148, 163, 184, 0.07);
    --snake: #4ade80;
    --snake-head: #22c55e;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at top, #1a2342 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 12px;
  }
  h1 {
    font-size: 1.5rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #4ade80, #facc15, #4ade80);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .hud strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .badges { display: flex; gap: 6px; font-size: 0.85rem; }
  .badge {
    padding: 2px 8px;
    border-radius: 999px;
    background: #1e293b;
    border: 1px solid #334155;
    display: none;
  }
  .badge.on { display: inline-block; }
  #badgeShield { color: #60a5fa; border-color: #3b82f6; }
  #badgeSlow { color: #c084fc; border-color: #a855f7; }
  #badgeCombo { color: #facc15; border-color: #eab308; }
  .board-wrap { position: relative; }
  canvas {
    display: block;
    background: var(--board);
    border: 2px solid #334155;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(74, 222, 128, 0.12);
    max-width: 92vw;
    max-height: 60vh;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(11, 16, 32, 0.85);
    border-radius: 10px;
    text-align: center;
    padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 1.5rem; }
  .overlay p { color: var(--muted); }
  .overlay .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .hint { color: var(--muted); font-size: 0.8rem; text-align: center; }
  kbd {
    background: #334155;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 0.78rem;
    color: var(--text);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Snake Deluxe</h1>
  <div class="hud">
    <span>Score: <strong id="score">0</strong></span>
    <span class="badges">
      <span class="badge" id="badgeShield">🛡 Shield</span>
      <span class="badge" id="badgeSlow">⚡ Slow-mo</span>
      <span class="badge" id="badgeCombo">🔥 x1</span>
    </span>
    <span>Best: <strong id="best">0</strong></span>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Snake Deluxe</h2>
      <p id="overlayText">Press any arrow key to start</p>
      <p id="overlayScore"></p>
      <div class="legend">
        <span>🍎 +1</span>
        <span>⭐ +5 (catch it fast!)</span>
        <span>🛡 survive one crash</span>
        <span>⚡ slow motion</span>
        <span>🔥 eat fast = combo</span>
      </div>
    </div>
  </div>
  <p class="hint">
    <kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd> /
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &middot;
    <kbd>Space</kbd> pause &middot;
    <kbd>M</kbd> sound &middot; swipe on mobile
  </p>
</div>

<script>
(function () {
  "use strict";

  var COLS = 20;
  var ROWS = 20;
  var BASE_TICK_MS = 150;
  var MIN_TICK_MS = 70;
  var SPEEDUP_PER_FOOD = 3;
  var COMBO_WINDOW_MS = 5000;
  var GOLDEN_LIFETIME_MS = 7000;
  var POWERUP_LIFETIME_MS = 9000;
  var SLOW_DURATION_MS = 6000;
  var SLOW_FACTOR = 1.7;

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var CELL = canvas.width / COLS;

  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var badgeShield = document.getElementById("badgeShield");
  var badgeSlow = document.getElementById("badgeSlow");
  var badgeCombo = document.getElementById("badgeCombo");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlayText = document.getElementById("overlayText");
  var overlayScore = document.getElementById("overlayScore");

  var snake, direction, nextDirection, food, score, best, baseTickMs;
  var golden, powerup, particles, floaters, stars;
  var combo, lastEatAt;
  var shield, slowUntil;
  var state = "idle";
  var lastFrame = 0;
  var accumulator = 0;
  var shake = 0;
  var foodsEaten = 0;
  var soundOn = true;
  var audioCtx = null;

  best = 0;
  try {
    best = parseInt(localStorage.getItem("snake-deluxe-best"), 10) || 0;
  } catch (e) {
    best = 0;
  }
  bestEl.textContent = best;

  stars = [];
  for (var i = 0; i < 40; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + 0.4,
      tw: Math.random() * Math.PI * 2
    });
  }

  function audio() {
    if (!soundOn) return null;
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        soundOn = false;
        return null;
      }
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function beep(freq, duration, type, volume) {
    var ac = audio();
    if (!ac) return;
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.08, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start();
    osc.stop(ac.currentTime + duration);
  }

  function sfxEat() { beep(520, 0.08, "square", 0.06); }
  function sfxGolden() { beep(660, 0.09, "triangle", 0.09); setTimeout(function () { beep(880, 0.12, "triangle", 0.09); }, 90); }
  function sfxPower() { beep(330, 0.1, "sawtooth", 0.06); setTimeout(function () { beep(494, 0.14, "sawtooth", 0.06); }, 100); }
  function sfxOver() {
    beep(300, 0.18, "sawtooth", 0.09);
    setTimeout(function () { beep(200, 0.22, "sawtooth", 0.09); }, 160);
    setTimeout(function () { beep(120, 0.35, "sawtooth", 0.09); }, 340);
  }
  function sfxShield() { beep(440, 0.16, "sine", 0.1); }

  function reset() {
    snake = [
      { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) },
      { x: Math.floor(COLS / 2) - 1, y: Math.floor(ROWS / 2) },
      { x: Math.floor(COLS / 2) - 2, y: Math.floor(ROWS / 2) }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = direction;
    score = 0;
    baseTickMs = BASE_TICK_MS;
    golden = null;
    powerup = null;
    particles = [];
    floaters = [];
    combo = 0;
    lastEatAt = 0;
    shield = false;
    slowUntil = 0;
    foodsEaten = 0;
    shake = 0;
    scoreEl.textContent = "0";
    updateBadges();
    placeFood();
  }

  function updateBadges() {
    badgeShield.classList.toggle("on", shield);
    badgeSlow.classList.toggle("on", performance.now() < slowUntil);
    if (combo > 1) {
      badgeCombo.textContent = "🔥 x" + Math.min(combo, 5);
      badgeCombo.classList.add("on");
    } else {
      badgeCombo.classList.remove("on");
    }
  }

  function freeCell() {
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var occupied = snake.some(function (s) { return s.x === x && s.y === y; });
        if (food && food.x === x && food.y === y) occupied = true;
        if (golden && golden.x === x && golden.y === y) occupied = true;
        if (powerup && powerup.x === x && powerup.y === y) occupied = true;
        if (!occupied) free.push({ x: x, y: y });
      }
    }
    return free[Math.floor(Math.random() * free.length)];
  }

  function placeFood() {
    food = freeCell();
  }

  function spawnGolden() {
    golden = freeCell();
    golden.expiresAt = performance.now() + GOLDEN_LIFETIME_MS;
  }

  function spawnPowerup() {
    powerup = freeCell();
    powerup.kind = Math.random() < 0.5 ? "shield" : "slow";
    powerup.expiresAt = performance.now() + POWERUP_LIFETIME_MS;
  }

  function setDirection(dx, dy) {
    if (state === "idle" || state === "over") {
      if (state === "idle") start();
      else return;
    }
    if (state !== "running") return;
    if (direction.x === -dx && direction.y === -dy) return;
    nextDirection = { x: dx, y: dy };
  }

  function start() {
    reset();
    state = "running";
    overlay.classList.add("hidden");
    lastFrame = performance.now();
    accumulator = 0;
  }

  function gameOver() {
    state = "over";
    shake = 14;
    sfxOver();
    var head = snake[0];
    burst(head.x, head.y, "#f87171", 26);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("snake-deluxe-best", String(best)); } catch (e) {}
    }
    overlayTitle.textContent = "Game Over";
    overlayText.textContent = "Press Enter or tap to play again";
    overlayScore.textContent = "Score: " + score + "  ·  Best: " + best;
    overlay.classList.remove("hidden");
  }

  function burst(cx, cy, color, count) {
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = Math.random() * 3 + 1;
      particles.push({
        x: cx * CELL + CELL / 2,
        y: cy * CELL + CELL / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color: color
      });
    }
  }

  function floatText(cx, cy, text, color) {
    floaters.push({ x: cx * CELL + CELL / 2, y: cy * CELL, text: text, color: color, life: 1 });
  }

  function eat(gained, cx, cy, color, isGolden) {
    score += gained;
    scoreEl.textContent = score;
    burst(cx, cy, color, isGolden ? 18 : 10);
    if (combo > 1) floatText(cx, cy, "+" + gained + " x" + Math.min(combo, 5), color);
    else floatText(cx, cy, "+" + gained, color);
  }

  function applyCombo(now) {
    if (now - lastEatAt <= COMBO_WINDOW_MS) {
      combo = Math.min(combo + 1, 5);
    } else {
      combo = 1;
    }
    lastEatAt = now;
  }

  function step(now) {
    direction = nextDirection;
    var head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    var hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
    var hitSelf = false;
    if (!hitWall) {
      for (var i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          hitSelf = true;
          break;
        }
      }
    }

    if (hitWall || hitSelf) {
      if (shield) {
        shield = false;
        sfxShield();
        floatText(snake[0].x, snake[0].y, "🛡 saved!", "#60a5fa");
        updateBadges();
        if (hitWall) {
          head.x = (head.x + COLS) % COLS;
          head.y = (head.y + ROWS) % ROWS;
        } else {
          head = { x: snake[0].x, y: snake[0].y };
          var alt = { x: -direction.y, y: -direction.x };
          nextDirection = alt;
          direction = alt;
          head = { x: snake[0].x + alt.x, y: snake[0].y + alt.y };
        }
      } else {
        gameOver();
        return;
      }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      applyCombo(now);
      var mult = Math.min(combo, 5);
      eat(1 * mult, head.x, head.y, "#4ade80", false);
      sfxEat();
      foodsEaten++;
      baseTickMs = Math.max(MIN_TICK_MS, baseTickMs - SPEEDUP_PER_FOOD);
      placeFood();
      if (!golden && Math.random() < 0.2) spawnGolden();
      if (!powerup && foodsEaten % 5 === 0) spawnPowerup();
    } else if (golden && head.x === golden.x && head.y === golden.y) {
      applyCombo(now);
      var gmult = Math.min(combo, 5);
      eat(5 * gmult, head.x, head.y, "#facc15", true);
      sfxGolden();
      golden = null;
    } else if (powerup && head.x === powerup.x && head.y === powerup.y) {
      sfxPower();
      burst(head.x, head.y, powerup.kind === "shield" ? "#60a5fa" : "#c084fc", 14);
      if (powerup.kind === "shield") {
        shield = true;
        floatText(head.x, head.y, "🛡 shield!", "#60a5fa");
      } else {
        slowUntil = now + SLOW_DURATION_MS;
        floatText(head.x, head.y, "⚡ slow-mo!", "#c084fc");
      }
      powerup = null;
      updateBadges();
    } else {
      snake.pop();
    }

    if (golden && now > golden.expiresAt) golden = null;
    if (powerup && now > powerup.expiresAt) powerup = null;
    if (now - lastEatAt > COMBO_WINDOW_MS && combo > 0) {
      combo = 0;
      updateBadges();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawStar(cx, cy, spikes, outerR, innerR) {
    var rot = Math.PI / 2 * 3;
    var step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for (var i = 0; i < spikes; i++) {
      ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
      rot += step;
      ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerR);
    ctx.closePath();
  }

  function draw(now) {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake = Math.max(0, shake - 1.2);
    }

    ctx.clearRect(-20, -20, canvas.width + 40, canvas.height + 40);

    ctx.fillStyle = "rgba(255,255,255,0.5)";
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      var alpha = 0.25 + 0.25 * Math.sin(now / 700 + st.tw);
      ctx.globalAlpha = alpha;
      ctx.fillRect(st.x, st.y, st.r, st.r);
    }
    ctx.globalAlpha = 1;

    ctx.strokeStyle = "rgba(148, 163, 184, 0.07)";
    ctx.lineWidth = 1;
    for (var g = 1; g < COLS; g++) {
      ctx.beginPath();
      ctx.moveTo(g * CELL, 0);
      ctx.lineTo(g * CELL, canvas.height);
      ctx.stroke();
    }
    for (g = 1; g < ROWS; g++) {
      ctx.beginPath();
      ctx.moveTo(0, g * CELL);
      ctx.lineTo(canvas.width, g * CELL);
      ctx.stroke();
    }

    if (food) {
      ctx.fillStyle = "#f87171";
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#16a34a";
      ctx.fillRect(food.x * CELL + CELL / 2 - 1, food.y * CELL + CELL * 0.08, 2, CELL * 0.16);
    }

    if (golden) {
      var left = golden.expiresAt - now;
      var pulse = 1 + 0.12 * Math.sin(now / 120);
      if (left < 2000) pulse *= (0.6 + 0.4 * Math.abs(Math.sin(now / 100)));
      ctx.fillStyle = "#facc15";
      ctx.shadowColor = "#facc15";
      ctx.shadowBlur = 12;
      drawStar(golden.x * CELL + CELL / 2, golden.y * CELL + CELL / 2, 5, CELL * 0.42 * pulse, CELL * 0.18 * pulse);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(250, 204, 21, 0.5)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(golden.x * CELL + CELL / 2, golden.y * CELL + CELL / 2, CELL * 0.55, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (left / GOLDEN_LIFETIME_MS));
      ctx.stroke();
    }

    if (powerup) {
      var pLeft = powerup.expiresAt - now;
      var pPulse = 1 + 0.1 * Math.sin(now / 150);
      var color = powerup.kind === "shield" ? "#60a5fa" : "#c084fc";
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      roundRect(powerup.x * CELL + 4, powerup.y * CELL + 4 + (1 - pPulse) * 2, CELL - 8, (CELL - 8) * pPulse, 5);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.font = (CELL * 0.55) + "px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(powerup.kind === "shield" ? "🛡" : "⚡", powerup.x * CELL + CELL / 2, powerup.y * CELL + CELL / 2 + 1);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.arc(powerup.x * CELL + CELL / 2, powerup.y * CELL + CELL / 2, CELL * 0.58, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (pLeft / POWERUP_LIFETIME_MS));
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    for (var i = snake.length - 1; i >= 0; i--) {
      var seg = snake[i];
      var t = 1 - i / snake.length;
      var pad = i === 0 ? 1.5 : 2.5;
      var r = Math.round(74 - 20 * (1 - t));
      var gc = Math.round(222 - 40 * (1 - t));
      var b = Math.round(128 - 20 * (1 - t));
      ctx.fillStyle = i === 0 ? "#22c55e" : "rgb(" + r + "," + gc + "," + b + ")";
      roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 4);
      ctx.fill();
    }

    var head = snake[0];
    if (shield) {
      ctx.strokeStyle = "#60a5fa";
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(now / 150);
      ctx.beginPath();
      ctx.arc(head.x * CELL + CELL / 2, head.y * CELL + CELL / 2, CELL * 0.62, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = "#052e16";
    var cx = head.x * CELL + CELL / 2;
    var cy = head.y * CELL + CELL / 2;
    var eye = CELL * 0.14;
    var off = CELL * 0.18;
    if (direction.x !== 0) {
      ctx.fillRect(cx - 2 + direction.x * off, cy - eye - 2, eye, eye);
      ctx.fillRect(cx - 2 + direction.x * off, cy + 2, eye, eye);
    } else {
      ctx.fillRect(cx - eye - 2, cy - 2 + direction.y * off, eye, eye);
      ctx.fillRect(cx + 2, cy - 2 + direction.y * off, eye, eye);
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 0.08;
      pt.life -= 0.03;
      if (pt.life <= 0) {
        particles.splice(p, 1);
        continue;
      }
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center";
    ctx.font = "bold " + (CELL * 0.6) + "px 'Segoe UI', sans-serif";
    for (var f = floaters.length - 1; f >= 0; f--) {
      var fl = floaters[f];
      fl.y -= 0.8;
      fl.life -= 0.02;
      if (fl.life <= 0) {
        floaters.splice(f, 1);
        continue;
      }
      ctx.globalAlpha = Math.max(0, fl.life);
      ctx.fillStyle = fl.color;
      ctx.fillText(fl.text, fl.x, fl.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function loop(now) {
    if (state === "running") {
      var tick = baseTickMs;
      if (now < slowUntil) tick = baseTickMs * SLOW_FACTOR;
      accumulator += now - lastFrame;
      while (accumulator >= tick) {
        accumulator -= tick;
        step(now);
        if (state !== "running") {
          accumulator = 0;
          break;
        }
      }
      updateBadges();
    }
    lastFrame = now;
    draw(now);
    requestAnimationFrame(loop);
  }

  var KEY_MAP = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };

  document.addEventListener("keydown", function (e) {
    if (e.key in KEY_MAP) {
      e.preventDefault();
      setDirection(KEY_MAP[e.key][0], KEY_MAP[e.key][1]);
    } else if (e.key === " " || e.key === "p" || e.key === "P") {
      e.preventDefault();
      togglePause();
    } else if (e.key === "Enter" && state === "over") {
      e.preventDefault();
      start();
    } else if (e.key === "m" || e.key === "M") {
      soundOn = !soundOn;
      floatText(snake[0].x, snake[0].y, soundOn ? "🔊 on" : "🔇 off", "#94a3b8");
    }
  });

  function togglePause() {
    if (state === "running") {
      state = "paused";
      overlayTitle.textContent = "Paused";
      overlayText.textContent = "Press Space to resume";
      overlayScore.textContent = "";
      overlay.classList.remove("hidden");
    } else if (state === "paused") {
      state = "running";
      overlay.classList.add("hidden");
      lastFrame = performance.now();
    }
  }

  var touchStart = null;
  canvas.addEventListener("touchstart", function (e) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener("touchend", function (e) {
    if (!touchStart) return;
    var dx = e.changedTouches[0].clientX - touchStart.x;
    var dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
      if (state === "over") start();
      return;
    }
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
    e.preventDefault();
  }, { passive: false });

  overlay.addEventListener("click", function () {
    if (state === "over" || state === "idle") start();
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
