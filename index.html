<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --board: #1e293b;
    --grid: rgba(148, 163, 184, 0.08);
    --snake: #4ade80;
    --snake-head: #22c55e;
    --food: #f87171;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
  }
  h1 {
    font-size: 1.6rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--snake);
  }
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 1rem;
    color: var(--muted);
  }
  .hud strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .board-wrap { position: relative; }
  canvas {
    display: block;
    background: var(--board);
    border: 2px solid #334155;
    border-radius: 8px;
    max-width: 92vw;
    max-height: 62vh;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(15, 23, 42, 0.82);
    border-radius: 8px;
    text-align: center;
    padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 1.5rem; }
  .overlay p { color: var(--muted); }
  .overlay .final { font-size: 1.1rem; color: var(--text); }
  .hint { color: var(--muted); font-size: 0.85rem; text-align: center; }
  kbd {
    background: #334155;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 0.8rem;
    color: var(--text);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Snake</h1>
  <div class="hud">
    <span>Score: <strong id="score">0</strong></span>
    <span>Best: <strong id="best">0</strong></span>
  </div>
  <div class="board-wrap">
    <canvas id="board" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Snake</h2>
      <p id="overlayText">Press any arrow key to start</p>
      <p class="final" id="overlayScore"></p>
    </div>
  </div>
  <p class="hint">
    <kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd> or
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move &middot;
    <kbd>Space</kbd> to pause &middot; swipe on mobile
  </p>
</div>

<script>
(function () {
  "use strict";

  var COLS = 20;
  var ROWS = 20;
  var BASE_TICK_MS = 150;
  var MIN_TICK_MS = 70;
  var SPEEDUP_PER_FOOD = 3;

  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var CELL = canvas.width / COLS;

  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlayText = document.getElementById("overlayText");
  var overlayScore = document.getElementById("overlayScore");

  var snake, direction, nextDirection, food, score, best, tickMs;
  var state = "idle";
  var lastTick = 0;
  var accumulator = 0;

  best = 0;
  try {
    best = parseInt(localStorage.getItem("snake-best"), 10) || 0;
  } catch (e) {
    best = 0;
  }
  bestEl.textContent = best;

  function reset() {
    snake = [
      { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) },
      { x: Math.floor(COLS / 2) - 1, y: Math.floor(ROWS / 2) },
      { x: Math.floor(COLS / 2) - 2, y: Math.floor(ROWS / 2) }
    ];
    direction = { x: 1, y: 0 };
    nextDirection = direction;
    score = 0;
    tickMs = BASE_TICK_MS;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var occupied = snake.some(function (s) { return s.x === x && s.y === y; });
        if (!occupied) free.push({ x: x, y: y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function setDirection(dx, dy) {
    if (state === "idle") {
      start();
    }
    if (state !== "running") return;
    if (direction.x === -dx && direction.y === -dy) return;
    nextDirection = { x: dx, y: dy };
  }

  function start() {
    reset();
    state = "running";
    overlay.classList.add("hidden");
    lastTick = performance.now();
    accumulator = 0;
  }

  function gameOver() {
    state = "over";
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("snake-best", String(best)); } catch (e) {}
    }
    overlayTitle.textContent = "Game Over";
    overlayText.textContent = "Press Enter to play again";
    overlayScore.textContent = "Score: " + score + "  ·  Best: " + best;
    overlay.classList.remove("hidden");
  }

  function togglePause() {
    if (state === "running") {
      state = "paused";
      overlayTitle.textContent = "Paused";
      overlayText.textContent = "Press Space to resume";
      overlayScore.textContent = "";
      overlay.classList.remove("hidden");
    } else if (state === "paused") {
      state = "running";
      overlay.classList.add("hidden");
      lastTick = performance.now();
    }
  }

  function step() {
    direction = nextDirection;
    var head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }
    for (var i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        gameOver();
        return;
      }
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      tickMs = Math.max(MIN_TICK_MS, tickMs - SPEEDUP_PER_FOOD);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--grid");
    ctx.lineWidth = 1;
    for (var g = 1; g < COLS; g++) {
      ctx.beginPath();
      ctx.moveTo(g * CELL, 0);
      ctx.lineTo(g * CELL, canvas.height);
      ctx.stroke();
    }
    for (g = 1; g < ROWS; g++) {
      ctx.beginPath();
      ctx.moveTo(0, g * CELL);
      ctx.lineTo(canvas.width, g * CELL);
      ctx.stroke();
    }

    ctx.fillStyle = "#f87171";
    var fx = food.x * CELL + CELL / 2;
    var fy = food.y * CELL + CELL / 2;
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.32, 0, Math.PI * 2);
    ctx.fill();

    for (var i = snake.length - 1; i >= 0; i--) {
      var seg = snake[i];
      var pad = i === 0 ? 1.5 : 2.5;
      ctx.fillStyle = i === 0 ? "#22c55e" : "#4ade80";
      roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 4);
      ctx.fill();
    }

    var head = snake[0];
    ctx.fillStyle = "#052e16";
    var cx = head.x * CELL + CELL / 2;
    var cy = head.y * CELL + CELL / 2;
    var eye = CELL * 0.14;
    var off = CELL * 0.18;
    if (direction.x !== 0) {
      ctx.fillRect(cx - 2 + direction.x * off, cy - eye - 2, eye, eye);
      ctx.fillRect(cx - 2 + direction.x * off, cy + 2, eye, eye);
    } else {
      ctx.fillRect(cx - eye - 2, cy - 2 + direction.y * off, eye, eye);
      ctx.fillRect(cx + 2, cy - 2 + direction.y * off, eye, eye);
    }
  }

  function loop(now) {
    if (state === "running") {
      accumulator += now - lastTick;
      while (accumulator >= tickMs) {
        accumulator -= tickMs;
        step();
        if (state !== "running") {
          accumulator = 0;
          break;
        }
      }
    }
    lastTick = now;
    if (snake) draw();
    requestAnimationFrame(loop);
  }

  var KEY_MAP = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };

  document.addEventListener("keydown", function (e) {
    if (e.key in KEY_MAP) {
      e.preventDefault();
      setDirection(KEY_MAP[e.key][0], KEY_MAP[e.key][1]);
    } else if (e.key === " " || e.key === "p" || e.key === "P") {
      e.preventDefault();
      togglePause();
    } else if (e.key === "Enter" && state === "over") {
      e.preventDefault();
      start();
    }
  });

  var touchStart = null;
  canvas.addEventListener("touchstart", function (e) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener("touchend", function (e) {
    if (!touchStart) return;
    var dx = e.changedTouches[0].clientX - touchStart.x;
    var dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
      if (state === "over") start();
      return;
    }
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
    e.preventDefault();
  }, { passive: false });

  overlay.addEventListener("click", function () {
    if (state === "over" || state === "idle") start();
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
